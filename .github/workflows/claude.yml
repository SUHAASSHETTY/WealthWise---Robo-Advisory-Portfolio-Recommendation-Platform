name: Claude Code Automated Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  claude-review:
    name: Spec Conformance & AC Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install poetry
          cd backend && poetry install --no-root
          cd ../frontend && npm ci

      - name: Run Claude Code Spec Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the changes in this pull request against the WealthWise source-of-truth specifications in `specs/app_spec.md` and related `specs/*.md` files.
            
            Verify:
            1. Spec Conformance: Ensure all implemented features conform strictly to AC-01 through AC-10.
            2. NFR-01 (Decimal Precision): Verify zero floating-point numbers are used for monetary amounts, units, NAV, and drift.
            3. NFR-02 (Append-Only): Confirm immutable records cannot be updated or deleted in place.
            4. NFR-03 (PII Protection): Ensure logs do not leak customer PII or raw financial figures.
            5. NFR-04 (Role & Tenant Isolation): Confirm role enforcement across Customer, Advisor, and Admin.
            6. Test Coverage: Confirm test assertions match every Then-clause in the acceptance criteria.
            
            Output a structured Markdown summary with:
            - Verdict (PASS/FAIL)
            - AC Verification Table
            - Identified Gaps or Risks
