[pytest]
# Single pytest config for the repo. Run from backend/: `cd backend && poetry run pytest [paths]`.
testpaths = tests
pythonpath = backend .
markers =
    ac(id): acceptance criterion this test proves (AC-NN)
addopts = -q --strict-markers --import-mode=importlib --cov=app --cov-report=term-missing --cov-report=xml:../coverage.xml
